<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>VaultX</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root[data-theme='dark']{
    --bg:#0B0D10; --surface:#14171C; --surface-2:#1B1F26; --surface-3:#20252D; --border:#262B33;
    --text:#F2F1EC; --muted:#8A8F98; --muted-2:#565B63;
    --gold:#D4AF6A; --gold-text:#0B0D10; --gold-soft:#2A2418; --gold-soft-text:#E8C889;
    --jade:#34C795; --jade-soft:#10281F; --jade-soft-text:#6FE0B6;
    --rust:#E86A4C; --rust-soft:#2E1913; --rust-soft-text:#F09980;
    --ring-track:#262B33; --overlay:rgba(0,0,0,0.65);
    --shadow:0 1px 2px rgba(0,0,0,0.5), 0 16px 40px rgba(0,0,0,0.55);
    --gold-glow:0 0 0 1px rgba(212,175,106,0.18), 0 8px 24px rgba(212,175,106,0.12);
  }
  :root[data-theme='light']{
    --bg:#F3F1EA; --surface:#FFFFFF; --surface-2:#ECE7DA; --surface-3:#E4DEC9; --border:#DED7C4;
    --text:#181611; --muted:#726C5C; --muted-2:#A19A85;
    --gold:#9C7A3C; --gold-text:#FFFFFF; --gold-soft:#F0E4C8; --gold-soft-text:#7A5E28;
    --jade:#1E8A63; --jade-soft:#DCEFE6; --jade-soft-text:#166B4C;
    --rust:#B4502D; --rust-soft:#F5E2D5; --rust-soft-text:#8C3E22;
    --ring-track:#DED7C4; --overlay:rgba(24,22,17,0.45);
    --shadow:0 1px 2px rgba(24,22,17,0.06), 0 10px 24px rgba(24,22,17,0.08);
    --gold-glow:0 0 0 1px rgba(156,122,60,0.15), 0 6px 16px rgba(156,122,60,0.1);
  }
  /* Semantic aliases — resolve through whichever theme root is active.
     Prefer these over --gold/--jade/--rust at call sites so intent (primary/success/danger)
     is legible without knowing the brand palette. */
  :root{
    --color-primary:var(--gold); --color-primary-text:var(--gold-text);
    --color-primary-soft:var(--gold-soft); --color-primary-soft-text:var(--gold-soft-text);
    --color-success:var(--jade); --color-success-soft:var(--jade-soft); --color-success-soft-text:var(--jade-soft-text);
    --color-danger:var(--rust); --color-danger-soft:var(--rust-soft); --color-danger-soft-text:var(--rust-soft-text);
    /* Spacing scale — use these instead of ad-hoc px values in new inline styles. */
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px; --space-10:40px;
    /* Radius scale */
    --radius-sm:12px; --radius-md:16px; --radius-lg:24px; --radius-full:9999px;
    /* Minimum touch target for interactive icon-only controls (WCAG 2.5.5) */
    --tap-min:44px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter',ui-sans-serif,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .fd{ font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif; }
  .tab-nums{ font-variant-numeric:tabular-nums; }
  .vx-root{ display:flex; justify-content:center; min-height:100vh; }
  .vx-app{ width:100%; max-width:448px; min-height:100vh; position:relative; padding-bottom:96px; }
  .card{ background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); }
  .input{ background:var(--surface-2); border:1px solid var(--border); color:var(--text); }
  .input::placeholder{ color:var(--muted-2); }
  .divider{ border-top:1px dashed var(--border); }
  .no-scroll::-webkit-scrollbar{ display:none; }
  .no-scroll{ -ms-overflow-style:none; scrollbar-width:none; }
  .btn-primary{ background:var(--gold); color:var(--gold-text); box-shadow:var(--gold-glow); }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-primary:active{ transform:scale(0.98); }
  .btn-primary:disabled{ opacity:0.5; box-shadow:none; cursor:not-allowed; transform:none; filter:none; }
  .btn-secondary{ background:var(--surface-2); border:1px solid var(--border); color:var(--text); }
  .btn-secondary:hover{ background:var(--surface-3); }
  .btn-secondary:disabled{ opacity:0.5; cursor:not-allowed; }
  .chip{ background:var(--surface-2); border:1px solid var(--border); color:var(--muted); }
  .chip.active{ background:var(--gold); border-color:var(--gold); color:var(--gold-text); }
  .icon-btn{ color:var(--muted); min-width:var(--tap-min); min-height:var(--tap-min); display:inline-flex; align-items:center; justify-content:center; }
  .icon-btn:hover{ color:var(--text); }
  .input.invalid{ border-color:var(--rust); }
  .input:disabled{ opacity:0.55; cursor:not-allowed; }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  a, button, input, select { font-family:inherit; }
  button{ cursor:pointer; }
  button:disabled{ cursor:not-allowed; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--gold); outline-offset:1px; }
  .ring circle{ transition:stroke-dashoffset .5s ease; }
</style>
</head>
<body>
<div class="vx-root"><main id="app" class="vx-app"></main></div>
<script>
/* ============================== ICONS ============================== */
const ICONS = {
  home:s=>`<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9h5v-6h4v6h5v-9"/>`,

  x:s=>`<path d="M6 6l12 12M18 6L6 18"/>`,
  chevronLeft:s=>`<path d="M15 5l-7 7 7 7"/>`,
  chevronRight:s=>`<path d="M9 5l7 7-7 7"/>`,
  chevronDown:s=>`<path d="M5 9l7 7 7-7"/>`,
  search:s=>`<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>`,

  sun:s=>`<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>`,
  moon:s=>`<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>`,

  bank:s=>`<path d="M3 21h18M4 21V10M20 21V10M2 10l10-6 10 6M8 21v-7M12 21v-7M16 21v-7"/>`,
  card:s=>`<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/>`,

  trash:s=>`<path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/>`,
  edit:s=>`<path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M13 6l3 3"/>`,
  copy:s=>`<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M5 15V4a1 1 0 0 1 1-1h11"/>`,
  download:s=>`<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>`,
  upload:s=>`<path d="M12 21V9M7 14l5-5 5 5M5 3h14"/>`,
  trendUp:s=>`<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>`,
  trendDown:s=>`<path d="M3 7l6 6 4-4 8 8M15 17h6v-6"/>`,
  alert:s=>`<path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4"/><circle cx="12" cy="17" r="0.9" fill="currentColor" stroke="none"/>`,
  refresh:s=>`<path d="M4 4v6h6"/><path d="M20 20v-6h-6"/><path d="M20 10a8 8 0 0 0-14.9-3.6M4 14a8 8 0 0 0 14.9 3.6"/>`,
  scale:s=>`<path d="M12 3v18M6 8l-3 6a3 3 0 0 0 6 0zM18 8l3 6a3 3 0 0 0-6 0z"/><path d="M6 8h12M4 21h16"/>`,
  folder:s=>`<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>`,
  check:s=>`<path d="M4 12l5 5L20 6"/>`,
  tag:s=>`<path d="M20 12l-8 8-9-9V4h7z"/><circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none"/>`,
  lock:s=>`<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>`,
};
function ic(name, size=18, color='currentColor'){
  const body = (ICONS[name] || ICONS.tag)();
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
}

/* ============================== CONSTANTS ============================== */
const PALETTE = ["#D4AF6A","#34C795","#E86A4C","#5C8AD9","#B98AE0","#5CC2C0","#E0A85C","#8AA6E0","#E05C8A","#7ADB9E"];
/* Stored swatch colors (categories, badges, recurring rules) are persisted as concrete hex,
   so they can't reference CSS custom properties directly (e.g. `${color}22` alpha-suffix
   concatenation in badge()). These constants keep the *one* source of truth for those
   hardcoded fallbacks instead of the same literal being retyped at each call site — they
   intentionally mirror the dark-theme --muted/--jade/--rust token values. */
const MUTED_HEX = '#8A8F98';
const JADE_HEX = '#34C795';
const RUST_HEX = '#E86A4C';
const DEFAULT_EXPENSE_CATS = ["Food","Transport","Bills","Shopping","Health","Entertainment"];
const DEFAULT_INCOME_CATS = ["Salary","Overtime/Claims","Allowance","Freelance/Side Income"];
const ACCOUNT_TYPES = [
  { value:"bank", label:"Bank Account", icon:"bank" },
  { value:"cash", label:"Cash", icon:"wallet" },
  { value:"credit", label:"Credit Card", icon:"card" },
  { value:"ewallet", label:"E-Wallet", icon:"phone" },
];

/* ============================== UTILS ============================== */
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function toCents(v){ const n = parseFloat(String(v||'0').replace(/,/g,'')); return isFinite(n) ? Math.round(n*100) : 0; }
function formatMYR(cents, showSign=false){
  const neg = cents < 0; const abs = Math.abs(cents||0);
  const str = (abs/100).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
  return `${neg?'-':(showSign?'+':'')}RM ${str}`;
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function monthKey(d){ return (d||'').slice(0,7); }
function ymLabel(ym){ const [y,m]=ym.split('-'); return new Date(Number(y),Number(m)-1,1).toLocaleDateString('en-MY',{month:'short',year:'2-digit'}); }
function addMonths(ym,n){ const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+n,1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function niceDate(dateStr){
  const today = todayStr(); const yest = new Date(Date.now()-86400000).toISOString().slice(0,10);
  if (dateStr===today) return 'Today';
  if (dateStr===yest) return 'Yesterday';
  return new Date(dateStr+'T00:00:00').toLocaleDateString('en-MY',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
}
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

/* storage — window.storage (NOT localStorage/sessionStorage) */
async function loadKey(key, fallback){
  try{ if(!window.storage) return fallback; const res = await window.storage.get(key,false); return res && res.value ? JSON.parse(res.value) : fallback; }
  catch{ return fallback; }
}
async function saveKey(key, value){
  try{ if(!window.storage) return; await window.storage.set(key, JSON.stringify(value), false); }
  catch(e){ console.error('save failed', key, e); }
}
function downloadTextFile(filename, text){
  const blob = new Blob([text], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

/* ============================== STATE ============================== */
let state = {
  loaded:false, storageOk:true,
  accounts:[], categories:[], transactions:[], recurringRules:[], budgets:{},
  settings:{ theme:'dark', seeded:false, lastAccountId:null, lastCategoryId:{}, activeTag:'all' },
  tab:'dashboard', moreView:null,
  quickAdd:null,
  txnFilterOpen:false,
  txnFilter:{ search:'', range:'all', accountId:'all', categoryId:'all', tag:'all', type:'all' },
  reportRange:'thisMonth', trendMonths:6,
  toast:null,
  confirmDelete:null, confirmDeleteAccount:null, confirmDeleteCategory:null,
  editingAccount:null, editingCategory:null, categoriesTypeTab:'expense',
  budgetEditing:null, budgetDraft:'',
};
let charts = { pie:null, bar:null };
let toastTimer = null;

function showToast(msg){
  state.toast = msg; render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ state.toast=null; render(); }, 2600);
}

/* ============================== INIT ============================== */
async function init(){
  if (!window.storage) state.storageOk = false;
  const [acc, cats, txns, rules, bud, sett] = await Promise.all([
    loadKey('vx_accounts', []),
    loadKey('vx_categories', []),
    loadKey('vx_transactions', []),
    loadKey('vx_recurring', []),
    loadKey('vx_budgets', {}),
    loadKey('vx_settings', { theme:'dark', seeded:false, lastAccountId:null, lastCategoryId:{}, activeTag:'all' }),
  ]);
  let finalAccounts=acc, finalCategories=cats, finalSettings=sett;
  if (!sett.seeded){
    finalCategories = [
      ...DEFAULT_EXPENSE_CATS.map((name,i)=>({ id:uid(), name, type:'expense', isDefault:true, color:PALETTE[i%PALETTE.length] })),
      ...DEFAULT_INCOME_CATS.map((name,i)=>({ id:uid(), name, type:'income', isDefault:true, color:PALETTE[(i+6)%PALETTE.length] })),
    ];
    finalAccounts = [
      { id:uid(), name:'Cash', type:'cash', color:PALETTE[1], startingBalanceCents:0 },
      { id:uid(), name:"Touch 'n Go eWallet", type:'ewallet', color:PALETTE[3], startingBalanceCents:0 },
    ];
    finalSettings = { ...sett, seeded:true };
    await Promise.all([saveKey('vx_categories',finalCategories), saveKey('vx_accounts',finalAccounts), saveKey('vx_settings',finalSettings)]);
  }
  state.accounts=finalAccounts; state.categories=finalCategories; state.transactions=txns;
  state.recurringRules=rules; state.budgets=bud; state.settings=finalSettings;
  document.documentElement.setAttribute('data-theme', finalSettings.theme || 'dark');
  state.loaded = true;
  render();
  generateDueRecurring();
}

/* ============================== RECURRING GENERATION ============================== */
function generateDueRecurring(){
  if (state.recurringRules.length===0) return;
  const curYM = monthKey(todayStr());
  let newTxns = [];
  state.recurringRules = state.recurringRules.map(rule=>{
    let cursor = rule.lastGeneratedYM; let guard=0; const rows=[];
    while (cursor < curYM && guard < 36){
      cursor = addMonths(cursor, 1);
      const [y,m] = cursor.split('-').map(Number);
      const day = Math.min(rule.dayOfMonth, daysInMonth(y,m));
      const date = `${cursor}-${String(day).padStart(2,'0')}`;
      rows.push({ id:uid(), type:rule.type, amountCents:rule.amountCents, date, categoryId:rule.categoryId, accountId:rule.accountId, note:rule.note, tag:rule.tag, recurringId:rule.id });
      guard++;
    }
    if (rows.length) newTxns = newTxns.concat(rows);
    return rows.length ? { ...rule, lastGeneratedYM: cursor } : rule;
  });
  if (newTxns.length){
    state.transactions = state.transactions.concat(newTxns);
    persist('vx_transactions', state.transactions);
    persist('vx_recurring', state.recurringRules);
    showToast(`Generated ${newTxns.length} recurring transaction${newTxns.length===1?'':'s'}`);
  }
}

/* ============================== PERSISTENCE ============================== */
function persist(key, value){ saveKey(key, value); }
function setAccounts(v){ state.accounts=v; persist('vx_accounts', v); }
function setCategories(v){ state.categories=v; persist('vx_categories', v); }
function setTransactions(v){ state.transactions=v; persist('vx_transactions', v); }
function setRecurringRules(v){ state.recurringRules=v; persist('vx_recurring', v); }
function setBudgets(v){ state.budgets=v; persist('vx_budgets', v); }
function setSettings(v){ state.settings=v; persist('vx_settings', v); document.documentElement.setAttribute('data-theme', v.theme); }

/* ============================== DERIVED DATA ============================== */
function accountBalance(acc, txns){
  const sign = acc.type==='credit' ? -1 : 1;
  let bal = acc.startingBalanceCents;
  for (const t of txns){ if (t.accountId!==acc.id) continue; bal += sign*(t.type==='income'?t.amountCents:-t.amountCents); }
  return bal;
}
function matchesTag(t, tag){ return tag==='all' || t.tag===tag; }
function inRange(dateStr, range){
  if (range==='all') return true;
  const now = new Date(); const d = new Date(dateStr+'T00:00:00');
  if (range==='thisMonth') return monthKey(dateStr)===monthKey(todayStr());
  if (range==='lastMonth') return monthKey(dateStr)===addMonths(monthKey(todayStr()),-1);
  if (range==='last3'){ const c=new Date(now); c.setMonth(c.getMonth()-3); return d>=c; }
  if (range==='last6'){ const c=new Date(now); c.setMonth(c.getMonth()-6); return d>=c; }
  return true;
}
function derive(){
  const catById = Object.fromEntries(state.categories.map(c=>[c.id,c]));
  const accById = Object.fromEntries(state.accounts.map(a=>[a.id,a]));
  const expenseCats = state.categories.filter(c=>c.type==='expense');
  const incomeCats = state.categories.filter(c=>c.type==='income');
  const balances = Object.fromEntries(state.accounts.map(a=>[a.id, accountBalance(a, state.transactions)]));
  const totalAssets = state.accounts.filter(a=>a.type!=='credit').reduce((s,a)=>s+balances[a.id],0);
  const totalLiabilities = state.accounts.filter(a=>a.type==='credit').reduce((s,a)=>s+balances[a.id],0);
  const netTotal = totalAssets - totalLiabilities;
  const curYM = monthKey(todayStr());
  const thisMonthTxns = state.transactions.filter(t=>monthKey(t.date)===curYM && matchesTag(t, state.settings.activeTag));
  const monthIncome = thisMonthTxns.filter(t=>t.type==='income').reduce((s,t)=>s+t.amountCents,0);
  const monthExpense = thisMonthTxns.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amountCents,0);
  const monthNet = monthIncome - monthExpense;
  const budgetStatus = expenseCats.filter(c=>state.budgets[c.id]).map(c=>{
    const spent = thisMonthTxns.filter(t=>t.type==='expense' && t.categoryId===c.id).reduce((s,t)=>s+t.amountCents,0);
    const limit = state.budgets[c.id];
    return { cat:c, spent, limit, pct: limit ? (spent/limit)*100 : 0 };
  });
  const overBudget = budgetStatus.filter(b=>b.pct>=100);
  return { catById, accById, expenseCats, incomeCats, balances, totalAssets, totalLiabilities, netTotal, curYM, thisMonthTxns, monthIncome, monthExpense, monthNet, budgetStatus, overBudget };
}
function filteredTxns(D){
  return state.transactions
    .filter(t=>inRange(t.date, state.txnFilter.range))
    .filter(t=>state.txnFilter.accountId==='all' || t.accountId===state.txnFilter.accountId)
    .filter(t=>state.txnFilter.categoryId==='all' || t.categoryId===state.txnFilter.categoryId)
    .filter(t=>state.txnFilter.tag==='all' || t.tag===state.txnFilter.tag)
    .filter(t=>state.txnFilter.type==='all' || t.type===state.txnFilter.type)
    .filter(t=>{
      if (!state.txnFilter.search) return true;
      const s = state.txnFilter.search.toLowerCase();
      return (t.note||'').toLowerCase().includes(s) || (D.catById[t.categoryId]?.name||'').toLowerCase().includes(s) || (D.accById[t.accountId]?.name||'').toLowerCase().includes(s);
    })
    .sort((a,b)=>b.date.localeCompare(a.date));
}
function groupByDate(txns){
  const groups=[]; let last=null;
  for (const t of txns){ if (t.date!==last){ groups.push({date:t.date, items:[]}); last=t.date; } groups[groups.length-1].items.push(t); }
  return groups;
}

/* ============================== ACTIONS ============================== */
function setTab(t){ state.tab=t; state.moreView=null; render(); }
function setMoreView(v){ state.moreView=v; render(); }
function toggleTheme(){ setSettings({...state.settings, theme: state.settings.theme==='dark'?'light':'dark'}); render(); }

function saveQuickAdd(){
  const amountCents = toCents(state.quickAdd.amount);
  const invalid = { amount: amountCents<=0, categoryId: !state.quickAdd.categoryId, accountId: !state.quickAdd.accountId };
  if (invalid.amount || invalid.categoryId || invalid.accountId){
    state.quickAdd.invalid = invalid;
    showToast('Please enter an amount, category and account');
    render();
    return;
  }
  state.quickAdd.invalid = null;
  const base = { type:state.quickAdd.type, amountCents, date:state.quickAdd.date, categoryId:state.quickAdd.categoryId, accountId:state.quickAdd.accountId, note:state.quickAdd.note, tag:state.quickAdd.tag };
  if (state.quickAdd.editingId){
    setTransactions(state.transactions.map(t=>t.id===state.quickAdd.editingId?{...t,...base}:t));
    showToast('Transaction updated');
  } else {
    setTransactions([...state.transactions, { id:uid(), ...base }]);
    if (state.quickAdd.repeatMonthly){
      const d = new Date(state.quickAdd.date+'T00:00:00');
      setRecurringRules([...state.recurringRules, { id:uid(), ...base, dayOfMonth:d.getDate(), lastGeneratedYM: monthKey(state.quickAdd.date) }]);
      showToast('Transaction added — will repeat monthly');
    } else { showToast('Transaction added'); }
  }
  setSettings({ ...state.settings, lastAccountId: state.quickAdd.accountId, lastCategoryId: { ...state.settings.lastCategoryId, [state.quickAdd.type]: state.quickAdd.categoryId } });
  state.quickAdd = null; render();
}

/* category / account management */
function ensureUncategorized(type){
  let c = state.categories.find(c=>c.name==='Uncategorized' && c.type===type);
  if (c) return c.id;
  const nc = { id:uid(), name:'Uncategorized', type, isDefault:false, color:MUTED_HEX };
  setCategories([...state.categories, nc]);
  return nc.id;
}
/* Deleting a category or account is destructive (categories reassign every linked
   transaction to "Uncategorized"; accounts vanish outright), so both now go through an
   ask -> confirm sheet, the same pattern already used for deleting a transaction —
   previously these deleted immediately on tap with no confirmation. */
function askDeleteCategory(id){
  const cat = state.categories.find(c=>c.id===id); if(!cat) return;
  state.confirmDeleteCategory = cat; render();
}
function cancelDeleteCategory(){ state.confirmDeleteCategory=null; render(); }
function confirmDeleteCategoryAction(){
  const cat = state.confirmDeleteCategory; if(!cat) return;
  const fallbackId = ensureUncategorized(cat.type);
  setTransactions(state.transactions.map(t=>t.categoryId===cat.id?{...t,categoryId:fallbackId}:t));
  setCategories(state.categories.filter(c=>c.id!==cat.id));
  const nb = {...state.budgets}; delete nb[cat.id]; setBudgets(nb);
  state.confirmDeleteCategory=null; showToast(`"${cat.name}" deleted`); render();
}
function askDeleteAccount(id){
  const acc = state.accounts.find(a=>a.id===id); if(!acc) return;
  const used = state.transactions.filter(t=>t.accountId===id).length;
  if (used>0){ showToast(`Can't delete — ${used} transaction${used===1?'':'s'} use this account`); render(); return; }
  state.confirmDeleteAccount = acc; render();
}
function cancelDeleteAccount(){ state.confirmDeleteAccount=null; render(); }
function confirmDeleteAccountAction(){
  const acc = state.confirmDeleteAccount; if(!acc) return;
  setAccounts(state.accounts.filter(a=>a.id!==acc.id));
  state.confirmDeleteAccount=null; showToast(`"${acc.name}" removed`); render();
}

/* csv */
function handleExport(){
  const D = derive();
  const rows = state.transactions.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>({
    Date:t.date, Type:t.type, Category:D.catById[t.categoryId]?.name||'', Account:D.accById[t.accountId]?.name||'',
    Tag:t.tag, Amount:(t.amountCents/100).toFixed(2), Note:t.note||''
  }));
  const csv = Papa.unparse(rows);
  downloadTextFile(`vaultx-export-${todayStr()}.csv`, csv);
  showToast('CSV exported');
}
function triggerImportFile(){ document.getElementById('vx-import-input').click(); }
function handleImportFile(fileInput){
  const file = fileInput.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const parsed = Papa.parse(e.target.result, { header:true, skipEmptyLines:true });
    let newAccounts=[...state.accounts], newCategories=[...state.categories], newTxns=[...state.transactions], count=0;
    for (const row of parsed.data){
      const norm={}; Object.keys(row).forEach(k=>norm[k.trim().toLowerCase()] = (row[k]||'').toString().trim());
      const type = (norm.type||'').toLowerCase()==='income' ? 'income':'expense';
      const amountCents = toCents(norm.amount);
      if (!amountCents) continue;
      const dateStr = /^\d{4}-\d{2}-\d{2}$/.test(norm.date) ? norm.date : todayStr();
      const tag = norm.tag && norm.tag.toLowerCase()==='business' ? 'business':'personal';
      let cat = newCategories.find(c=>c.name.toLowerCase()===(norm.category||'').toLowerCase() && c.type===type);
      if (!cat){ cat = { id:uid(), name: norm.category||'Uncategorized', type, isDefault:false, color:PALETTE[newCategories.length%PALETTE.length] }; newCategories.push(cat); }
      let acc = newAccounts.find(a=>a.name.toLowerCase()===(norm.account||'').toLowerCase());
      if (!acc){ acc = { id:uid(), name: norm.account||'Imported', type:'bank', color:PALETTE[newAccounts.length%PALETTE.length], startingBalanceCents:0 }; newAccounts.push(acc); }
      newTxns.push({ id:uid(), type, amountCents, date:dateStr, categoryId:cat.id, accountId:acc.id, note:norm.note||'', tag });
      count++;
    }
    setCategories(newCategories); setAccounts(newAccounts); setTransactions(newTxns);
    fileInput.value='';
    showToast(`Imported ${count} transaction${count===1?'':'s'}`); render();
  };
  reader.readAsText(file);
}

/* ============================== RENDER: SMALL ATOMS ============================== */
function segmented(value, options, onChangeFn){
  return `<div role="group" class="inline-flex rounded-full p-1 card" style="border-radius:9999px;">
    ${options.map(o=>`<button type="button" onclick="${onChangeFn}('${o.value}')" aria-pressed="${value==o.value}" class="fd" style="padding:6px 14px;border-radius:9999px;font-size:13px;font-weight:600;border:none;${value==o.value ? `background:var(--gold);color:var(--gold-text);box-shadow:var(--gold-glow);` : `background:transparent;color:var(--muted);`}">${esc(o.label)}</button>`).join('')}
  </div>`;
}
function progressRing(percent, color, size=52){
  const stroke=6, r=(size-stroke)/2, c=2*Math.PI*r, pct=Math.max(0,Math.min(percent,100)), offset=c-(pct/100)*c;
  return `<svg class="ring" width="${size}" height="${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--ring-track)" stroke-width="${stroke}" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none" stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
  </svg>`;
}
function emptyState(iconName, title, sub, actionHtml){
  return `<div style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:56px 24px;color:var(--muted);">

}
function statChip(label, value, color){

  const rowLabel = `${isIncome?'Income':'Expense'} ${esc(t.note || (cat?cat.name:'Uncategorized'))}, ${formatMYR(t.amountCents)}, edit`;
  return `<div onclick="openEditTxn('${t.id}')" role="button" tabindex="0" aria-label="${rowLabel}" onkeydown="if(event.target===this&&(event.key==='Enter'||event.key===' ')){event.preventDefault();openEditTxn('${t.id}');}" style="display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border-left:3px solid ${color};${opts.last?'':'border-bottom:1px dashed var(--border);'}">
    ${badge(cat?cat.name:'?', cat?cat.color:MUTED_HEX, 36)}
    <div style="min-width:0;flex:1;">
      <p style="font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(t.note || (cat?cat.name:'Uncategorized'))}</p>
      <p style="font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(cat?cat.name:'')} · ${esc(acc?acc.name:'')}
        ${t.tag==='business' ? `<span style="margin-left:4px;padding:1px 6px;border-radius:9999px;font-size:10px;background:var(--gold-soft);color:var(--gold-soft-text);">Business</span>` : ''}
      </p>

    <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
      ${opts.showActions ? `
        <button onclick="event.stopPropagation();openDuplicateTxn('${t.id}')" aria-label="Duplicate transaction" class="icon-btn" style="background:none;border:none;border-radius:9999px;">${ic('copy',14)}</button>

      <p class="fd tab-nums" style="font-weight:600;font-size:14px;color:${color};">${isIncome?'+':'-'}${formatMYR(t.amountCents).replace('-','')}</p>
    </div>
  </div>`;
}

    <h2 class="fd" style="font-weight:600;font-size:16px;margin-top:24px;margin-bottom:8px;">Spending by category</h2>

        <div style="height:240px;"><canvas id="vx-pie"></canvas></div>

          ${pieData.map(d=>`<div style="display:flex;align-items:center;gap:6px;font-size:12px;">

            <span class="tab-nums" style="font-weight:500;">${formatMYR(d.value*100)}</span>
          </div>`).join('')}

    `}

    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:24px;margin-bottom:8px;">
      <h2 class="fd" style="font-weight:600;font-size:16px;">Income vs expense trend</h2>

function setReportRange(v){ state.reportRange=v; render(); }

function mountCharts(D){
  const reportTxns = state.transactions.filter(t=>inRange(t.date, state.reportRange) && matchesTag(t, state.settings.activeTag));
  const pieMap = {}; reportTxns.filter(t=>t.type==='expense').forEach(t=>{ pieMap[t.categoryId]=(pieMap[t.categoryId]||0)+t.amountCents; });
  const pieEntries = Object.entries(pieMap).map(([catId,val])=>({ name: D.catById[catId]?D.catById[catId].name:'Uncategorized', color: D.catById[catId]?D.catById[catId].color:MUTED_HEX, value: val/100 }));

  if (charts.pie){ charts.pie.destroy(); charts.pie=null; }
  const pieCanvas = document.getElementById('vx-pie');
  if (pieCanvas && pieEntries.length>0){
    charts.pie = new Chart(pieCanvas, {
      type:'doughnut',
      data:{ labels: pieEntries.map(d=>d.name), datasets:[{ data: pieEntries.map(d=>d.value), backgroundColor: pieEntries.map(d=>d.color), borderWidth:0 }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:(ctx)=>` RM ${ctx.parsed.toFixed(2)}` } } } }
    });
  }

  if (charts.bar){ charts.bar.destroy(); charts.bar=null; }
  const barCanvas = document.getElementById('vx-bar');
  if (barCanvas){
    const curYM = monthKey(todayStr());
    const months = []; for (let i=state.trendMonths-1;i>=0;i--) months.push(addMonths(curYM,-i));
    const incomes = months.map(ym=>state.transactions.filter(t=>monthKey(t.date)===ym && t.type==='income' && matchesTag(t,state.settings.activeTag)).reduce((s,t)=>s+t.amountCents,0)/100);
    const expenses = months.map(ym=>state.transactions.filter(t=>monthKey(t.date)===ym && t.type==='expense' && matchesTag(t,state.settings.activeTag)).reduce((s,t)=>s+t.amountCents,0)/100);
    const gridColor = cssVar('--border'), textColor = cssVar('--muted'), jade = cssVar('--jade'), rust = cssVar('--rust');
    charts.bar = new Chart(barCanvas, {
      type:'bar',
      data:{ labels: months.map(ymLabel), datasets:[
        { label:'Income', data:incomes, backgroundColor:jade, borderRadius:4 },
        { label:'Expense', data:expenses, backgroundColor:rust, borderRadius:4 },
      ]},
      options:{ responsive:true, maintainAspectRatio:false,
        scales:{ x:{ ticks:{color:textColor,font:{size:11}}, grid:{color:gridColor} }, y:{ ticks:{color:textColor,font:{size:11}}, grid:{color:gridColor} } },
        plugins:{ legend:{ labels:{ color: cssVar('--text'), font:{size:12} } }, tooltip:{ callbacks:{ label:(ctx)=>` ${ctx.dataset.label}: RM ${ctx.parsed.y.toFixed(2)}` } } }
      }
    });
  }
}

      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">${ic('upload',18)}<p style="font-weight:500;font-size:14px;">Import from CSV</p></div>
      <p style="font-size:14px;margin-bottom:12px;color:var(--muted);">CSV columns: Date, Type, Category, Account, Tag, Amount, Note. Missing accounts/categories are created automatically.</p>
      <input id="vx-import-input" type="file" accept=".csv" style="display:none;" onchange="handleImportFile(this)" />
      <button onclick="triggerImportFile()" class="btn-secondary" style="width:100%;padding:10px;border-radius:12px;font-weight:600;border:none;">Choose CSV file</button>
    </div>`;
  return subPage('Export & import', body);
}

            ${badge(c.name, qa.categoryId===c.id?cssVar('--gold-text'):c.color, 24)}

      <div role="group" aria-labelledby="vx-qa-acc-label" class="no-scroll" style="display:flex;gap:8px;overflow-x:auto;">

/* ============================== MASTER RENDER ============================== */
function render(){
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;
  const vxModalOpenNow = vxAnyModalOpen();
  if (vxModalOpenNow && !vxModalWasOpen){ vxModalTriggerRecipe = vxCaptureTriggerRecipe(active); }

  const app = document.getElementById('app');
  if (!state.loaded){
    app.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted);">Loading VaultX…</div>`;
    return;
  }
  const D = derive();

  let pageHtml = '';
  if (state.moreView === 'accounts') pageHtml = renderAccountsView(D);
  else if (state.moreView === 'categories') pageHtml = renderCategoriesView();
  else if (state.moreView === 'networth') pageHtml = renderNetWorthView(D);
  else if (state.moreView === 'recurring') pageHtml = renderRecurringView(D);
  else if (state.moreView === 'data') pageHtml = renderDataView();
  else if (state.tab === 'dashboard') pageHtml = renderDashboard(D);
  else if (state.tab === 'transactions') pageHtml = renderTransactionsPage(D);
  else if (state.tab === 'budgets') pageHtml = renderBudgetsPage(D);
  else if (state.tab === 'reports') pageHtml = renderReportsPage(D);
  else if (state.tab === 'more') pageHtml = renderMorePage();

  const navHtml = state.moreView ? '' : `
    <nav aria-label="Primary" style="position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;">
      <div class="card" style="width:100%;max-width:448px;display:flex;border-top:1px solid var(--border);border-radius:0;">
        ${navBtn('home','Home','dashboard')}
        ${navBtn('list','Transactions','transactions')}
        ${navBtn('budget','Budgets','budgets')}
        ${navBtn('chart','Reports','reports')}
        ${navBtn('more','More','more')}
      </div>
    </nav>
    <div style="position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:center;pointer-events:none;">
      <div style="width:100%;max-width:448px;position:relative;">
        <button onclick="openQuickAdd()" aria-label="Add transaction" class="fd btn-primary" style="pointer-events:auto;position:absolute;bottom:76px;right:16px;border-radius:9999px;padding:16px;border:none;">${ic('plus',24, cssVar('--gold-text'))}</button>
      </div>
    </div>`;

  app.innerHTML = `${pageHtml}${navHtml}`;

  /* modals appended after main content */
  let modals = '';
  if (state.quickAdd){
    modals += sheet(state.quickAdd.editingId ? 'Edit transaction' : 'Add transaction', renderQuickAddSheetContent(D), 'closeQuickAdd()',
      `<button onclick="saveQuickAdd()" class="fd btn-primary" style="width:100%;padding:12px;border-radius:16px;font-weight:600;border:none;">${state.quickAdd.editingId?'Save changes':'Add transaction'}</button>`);
  }
  if (state.txnFilterOpen){
    modals += sheet('Filter transactions', renderTxnFilterSheetContent(), 'closeTxnFilter()');
  }
  if (state.confirmDelete){
    const t = state.confirmDelete; const cat = D.catById[t.categoryId];
    modals += sheet('Delete transaction?', `
      <p style="font-size:14px;margin-bottom:16px;color:var(--muted);">This will permanently remove "${esc(t.note || (cat?cat.name:''))}" (${formatMYR(t.amountCents)}).</p>
      <div style="display:flex;gap:12px;">
        <button onclick="cancelDeleteTxn()" autofocus class="btn-secondary" style="flex:1;padding:10px;border-radius:12px;font-weight:500;border:none;">Cancel</button>
        <button onclick="confirmDeleteTxn()" style="flex:1;padding:10px;border-radius:12px;font-weight:500;border:none;background:var(--rust);color:#fff;">Delete</button>
      </div>`, 'cancelDeleteTxn()');
  }
  if (state.confirmDeleteAccount){
    const acc = state.confirmDeleteAccount;
    modals += sheet('Delete account?', `
      <p style="font-size:14px;margin-bottom:16px;color:var(--muted);">This will permanently remove "${esc(acc.name)}". This can't be undone.</p>
      <div style="display:flex;gap:12px;">
        <button onclick="cancelDeleteAccount()" autofocus class="btn-secondary" style="flex:1;padding:10px;border-radius:12px;font-weight:500;border:none;">Cancel</button>
        <button onclick="confirmDeleteAccountAction()" style="flex:1;padding:10px;border-radius:12px;font-weight:500;border:none;background:var(--rust);color:#fff;">Delete</button>
      </div>`, 'cancelDeleteAccount()');
  }
  if (state.confirmDeleteCategory){
    const cat = state.confirmDeleteCategory;
    modals += sheet('Delete category?', `
      <p style="font-size:14px;margin-bottom:16px;color:var(--muted);">This will permanently remove "${esc(cat.name)}". Existing transactions in this category will move to "Uncategorized".</p>
      <div style="display:flex;gap:12px;">
        <button onclick="cancelDeleteCategory()" autofocus class="btn-secondary" style="flex:1;padding:10px;border-radius:12px;font-weight:500;border:none;">Cancel</button>
        <button onclick="confirmDeleteCategoryAction()" style="flex:1;padding:10px;border-radius:12px;font-weight:500;border:none;background:var(--rust);color:#fff;">Delete</button>
      </div>`, 'cancelDeleteCategory()');
  }
  if (state.editingAccount){
    const ea = state.editingAccount;
    modals += sheet(ea.id?'Edit account':'New account', `
      <div style="margin-bottom:16px;">
        <label for="vx-ea-name" style="display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;color:${ea.invalid?'var(--rust)':'var(--muted)'};margin-bottom:6px;">Name</label>
        <input id="vx-ea-name" autofocus value="${esc(ea.name)}" oninput="eaSet('name', this.value)" aria-invalid="${ea.invalid?'true':'false'}" placeholder="e.g. Maybank Savings" class="input${ea.invalid?' invalid':''}" style="width:100%;border-radius:12px;padding:10px 12px;font-size:14px;" />
        ${ea.invalid ? `<p role="alert" style="color:var(--rust);font-size:12px;margin-top:6px;">Enter an account name.</p>` : ''}
      </div>
      <div style="margin-bottom:16px;">
        <p id="vx-ea-type-label" style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;color:var(--muted);margin-bottom:6px;">Type</p>
        <div role="group" aria-labelledby="vx-ea-type-label" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          ${ACCOUNT_TYPES.map(t=>`<button type="button" onclick="eaSetRender('type','${t.value}')" aria-pressed="${ea.type===t.value}" style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;font-size:14px;border:1px solid var(--border);background:${ea.type===t.value?'var(--gold)':'var(--surface-2)'};color:${ea.type===t.value?'var(--gold-text)':'var(--text)'};">${ic(t.icon,15)} ${t.label}</button>`).join('')}
        </div>
      </div>
      <div style="margin-bottom:16px;">
        <p id="vx-ea-color-label" style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;color:var(--muted);margin-bottom:6px;">Color</p>
        <div role="group" aria-labelledby="vx-ea-color-label" style="display:flex;gap:8px;flex-wrap:wrap;">
          ${PALETTE.slice(0,8).map(c=>`<button type="button" onclick="eaSetRender('color','${c}')" aria-label="Color ${c}" aria-pressed="${ea.color===c}" style="width:28px;height:28px;border-radius:9999px;background:${c};border:${ea.color===c?'3px solid var(--text)':'1px solid var(--border)'};"></button>`).join('')}
        </div>
      </div>
      <div style="margin-bottom:16px;">
        <label for="vx-ea-balance" style="display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;color:var(--muted);margin-bottom:6px;">${ea.type==='credit'?'Current amount owed (RM)':'Starting balance (RM)'}</label>
        <input id="vx-ea-balance" type="text" inputmode="decimal" value="${esc(ea.startingBalance)}" oninput="eaSet('startingBalance', this.value.replace(/[^0-9.]/g,''))" class="input tab-nums" style="width:100%;border-radius:12px;padding:10px 12px;" placeholder="0.00" />
      </div>
      <button onclick="saveAccount()" class="fd btn-primary" style="width:100%;padding:12px;border-radius:16px;font-weight:600;border:none;">${ea.id?'Save changes':'Add account'}</button>
    `, 'closeEditAccount()');
  }
  if (state.editingCategory){
    const ec = state.editingCategory;
    modals += sheet(ec.id?'Edit category':'New category', `
      <div style="margin-bottom:16px;">
        <label for="vx-ec-name" style="display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;color:${ec.invalid?'var(--rust)':'var(--muted)'};margin-bottom:6px;">Name</label>
        <input id="vx-ec-name" autofocus value="${esc(ec.name)}" oninput="ecSet('name', this.value)" aria-invalid="${ec.invalid?'true':'false'}" class="input${ec.invalid?' invalid':''}" style="width:100%;border-radius:12px;padding:10px 12px;font-size:14px;" />
        ${ec.invalid ? `<p role="alert" style="color:var(--rust);font-size:12px;margin-top:6px;">Enter a category name.</p>` : ''}
      </div>
      <div style="margin-bottom:16px;">
        <p id="vx-ec-color-label" style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;color:var(--muted);margin-bottom:6px;">Color</p>
        <div role="group" aria-labelledby="vx-ec-color-label" style="display:flex;gap:8px;flex-wrap:wrap;">
          ${PALETTE.map(c=>`<button type="button" onclick="ecSet('color','${c}');render();" aria-label="Color ${c}" aria-pressed="${ec.color===c}" style="width:28px;height:28px;border-radius:9999px;background:${c};border:${ec.color===c?'3px solid var(--text)':'1px solid var(--border)'};"></button>`).join('')}
        </div>
      </div>
      <button onclick="saveCategory()" class="fd btn-primary" style="width:100%;padding:12px;border-radius:16px;font-weight:600;border:none;">${ec.id?'Save changes':'Add category'}</button>
    `, 'closeEditCategory()');
  }
  if (state.budgetEditing){
    const cat = D.catById[state.budgetEditing];
    modals += sheet('Set monthly budget', `
      <div style="margin-bottom:16px;">
        <label for="vx-budget-limit" style="display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;color:var(--muted);margin-bottom:6px;">Limit for ${esc(cat?cat.name:'')} (RM)</label>
        <input id="vx-budget-limit" autofocus type="text" inputmode="decimal" value="${esc(state.budgetDraft)}" oninput="state.budgetDraft=this.value.replace(/[^0-9.]/g,'')" placeholder="0.00" class="input fd tab-nums" style="width:100%;border-radius:12px;padding:12px 16px;font-size:20px;font-weight:600;" />
      </div>
      <button onclick="saveBudgetEdit()" class="fd btn-primary" style="width:100%;padding:12px;border-radius:16px;font-weight:600;border:none;">Save budget</button>
    `, 'closeBudgetEdit()');
  }

  app.insertAdjacentHTML('beforeend', modals);

  if (state.toast){
    app.insertAdjacentHTML('beforeend', `
      <div style="position:fixed;bottom:96px;left:50%;transform:translateX(-50%);z-index:50;padding:10px 18px;border-radius:9999px;font-size:13px;font-weight:500;" class="card">${esc(state.toast)}</div>
    `);
  }

  if (!state.moreView && state.tab === 'reports'){ mountCharts(D); }

  if (activeId){
    const el = document.getElementById(activeId);
    if (el){
      el.focus();
      if (selStart!==null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }

  /* Dialog just opened: move focus inside it, preferring the field marked [autofocus]
     (Chromium silently drops the native autofocus attribute here — "Autofocus processing
     was blocked" — whenever something on the page already holds focus, which is always
     true for us since the button that opened the dialog is still focused; the browser
     does NOT reliably reassign focus on its own for dynamically inserted content). Falls
     back to the first focusable element (skipping the close button) if none is marked.
     Dialog just closed: return focus to whatever triggered it, instead of leaving focus
     lost on <body>. */
  if (vxModalOpenNow && !vxModalWasOpen){
    const modalEl = document.querySelector('[data-modal="true"]');
    if (modalEl && !modalEl.contains(document.activeElement)){
      const focusable = modalEl.querySelector('[autofocus]') ||
        modalEl.querySelector('input, select, textarea, [tabindex], button:not([data-modal-close])');
      if (focusable) focusable.focus();
    }
  } else if (!vxModalOpenNow && vxModalWasOpen && vxModalTriggerRecipe){
    const triggerEl = vxFindByRecipe(vxModalTriggerRecipe);
    if (triggerEl){ try{ triggerEl.focus(); }catch(e){} }
    vxModalTriggerRecipe = null;
  }
  vxModalWasOpen = vxModalOpenNow;
}
function navBtn(iconName, label, tabKey){
  const active = state.tab===tabKey;
  return `<button onclick="setTab('${tabKey}')" aria-current="${active?'page':'false'}" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 0;background:none;border:none;color:${active?'var(--gold)':'var(--muted)'};">
    <span aria-hidden="true">${ic(iconName,19)}</span><span style="font-size:10px;font-weight:500;">${label}</span>
  </button>`;
}
function sheet(title, contentHtml, onCloseFn, footerHtml){
  return `
  <div data-modal="true" style="position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;">
    <div style="position:absolute;inset:0;background:var(--overlay);" onclick="${onCloseFn}"></div>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="vx-modal-title" style="position:relative;width:100%;max-width:448px;border-radius:24px 24px 0 0;display:flex;flex-direction:column;max-height:88vh;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid var(--border);">
        <h2 id="vx-modal-title" class="fd" style="font-size:18px;font-weight:600;">${esc(title)}</h2>
        <button onclick="${onCloseFn}" aria-label="Close" data-modal-close="true" class="icon-btn" style="background:none;border:none;border-radius:9999px;color:var(--muted);">${ic('x',20)}</button>
      </div>
      <div style="overflow-y:auto;padding:16px 20px;">${contentHtml}</div>
      ${footerHtml ? `<div style="padding:16px 20px;border-top:1px solid var(--border);">${footerHtml}</div>` : ''}
    </div>
  </div>`;
}

/* ============================== MODAL A11Y: focus trap + Escape-to-close ==============================
   sheet() renders at most one open dialog at a time (state only ever sets one of the
   modal-state fields below). This tracks the element that had focus before a dialog opened
   so it can be restored on close, moves focus into the dialog when it first appears, traps
   Tab cycling inside it while open, and lets Escape close whichever dialog is showing —
   none of which the sheet markup previously did on its own.
   render() always rebuilds the whole #app subtree from a fresh HTML string (no diffing),
   so a plain element *reference* captured before a dialog opens is a detached, dead node by
   the time the dialog closes — calling .focus() on it silently does nothing. Instead we
   remember a small "recipe" (id, or exact aria-label text) and re-find the live element by
   that recipe after the closing render. If the trigger no longer exists (e.g. the row it
   belonged to was just deleted), we simply leave focus where the browser puts it by default
   rather than throw — a no-op, not a regression from the original zero focus-management. */
let vxModalTriggerRecipe = null;
let vxModalWasOpen = false;
function vxCaptureTriggerRecipe(el){
  if (!el || el===document.body) return null;
  if (el.id) return { type:'id', value: el.id };
  const label = el.getAttribute && el.getAttribute('aria-label');
  if (label) return { type:'aria-label', value: label };
  return null;
}
function vxFindByRecipe(recipe){
  if (!recipe) return null;
  if (recipe.type==='id') return document.getElementById(recipe.value);
  if (recipe.type==='aria-label'){
    const all = document.querySelectorAll('[aria-label]');
    for (let i=0;i<all.length;i++){ if (all[i].getAttribute('aria-label')===recipe.value) return all[i]; }
  }
  return null;
}
function vxAnyModalOpen(){
  return !!(state.quickAdd || state.txnFilterOpen || state.confirmDelete || state.confirmDeleteAccount ||
    state.confirmDeleteCategory || state.editingAccount || state.editingCategory || state.budgetEditing);
}
function closeAnyModal(){
  if (state.quickAdd) return closeQuickAdd();
  if (state.txnFilterOpen) return closeTxnFilter();
  if (state.confirmDelete) return cancelDeleteTxn();
  if (state.confirmDeleteAccount) return cancelDeleteAccount();
  if (state.confirmDeleteCategory) return cancelDeleteCategory();
  if (state.editingAccount) return closeEditAccount();
  if (state.editingCategory) return closeEditCategory();
  if (state.budgetEditing) return closeBudgetEdit();
}
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){ if (vxAnyModalOpen()){ e.preventDefault(); closeAnyModal(); } return; }
  if (e.key === 'Tab'){
    const modal = document.querySelector('[data-modal="true"]');
    if (!modal) return;
    const focusables = Array.prototype.slice.call(modal.querySelectorAll('button,[href],input,select,textarea,[tabindex]'))
      .filter(el=>!el.disabled && el.tabIndex!==-1 && el.offsetParent!==null);
    if (!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length-1];
    if (e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
});

/* boot */
init();
</script>
